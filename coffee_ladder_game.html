<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커피쏘기 사다리타기</title>
<style>
:root{
  --bg:#f6f7fb;
  --card:#fff;
  --text:#1f2937;
  --muted:#6b7280;
  --line:#e5e7eb;
  --coffee:#8b5e3c;
  --coffee-dark:#5f3c26;
  --cream:#fff7ed;
  --accent:#7c3aed;
  --green:#16a34a;
  --shadow:0 14px 35px rgba(31,41,55,.09);
  --radius:22px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 0%,rgba(139,94,60,.10),transparent 26%),
    radial-gradient(circle at 100% 10%,rgba(124,58,237,.08),transparent 25%),
    var(--bg);
}
.wrap{
  width:min(1120px,calc(100% - 24px));
  margin:auto;
  padding:30px 0 56px;
}
.hero{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:22px;
}
.hero h1{
  margin:0 0 8px;
  font-size:clamp(30px,5vw,48px);
  letter-spacing:-.045em;
}
.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.7;
}
.bean{
  font-size:52px;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.10));
}
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}
.setup{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:18px;
}
.control-title{
  font-size:17px;
  font-weight:900;
  margin-bottom:14px;
}
.count-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}
.count-row label{font-weight:800}
.count-row select{
  flex:1;
  min-height:44px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:0 12px;
  font-size:16px;
  background:#fff;
  color:var(--text);
}
.names{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.name-input{
  min-width:0;
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  font-size:16px;
  font-weight:700;
  outline:none;
}
.name-input:focus{
  border-color:var(--coffee);
  box-shadow:0 0 0 4px rgba(139,94,60,.10);
}
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
}
button{
  min-height:46px;
  border:0;
  border-radius:13px;
  padding:0 17px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  transition:.18s ease;
}
button:active{transform:scale(.98)}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{
  background:linear-gradient(135deg,var(--coffee),var(--coffee-dark));
  color:#fff;
  box-shadow:0 9px 18px rgba(95,60,38,.22);
}
.secondary{
  background:#f5f3ff;
  color:#6d28d9;
  border:1px solid #ddd6fe;
}
.guide{
  margin-top:14px;
  padding:12px 13px;
  background:var(--cream);
  border-radius:12px;
  color:#92400e;
  font-size:13px;
  line-height:1.55;
}
.game-panel{
  margin-top:18px;
}
.game-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  margin-bottom:14px;
}
.game-head h2{
  margin:0;
  font-size:20px;
}
.status{
  font-size:14px;
  color:var(--muted);
  font-weight:700;
}
.ladder-scroll{
  width:100%;
  overflow-x:auto;
  padding:6px 2px 8px;
}
.ladder-stage{
  position:relative;
  min-width:640px;
  width:100%;
  height:500px;
  background:
    linear-gradient(#fff,#fff) padding-box,
    linear-gradient(135deg,#f3f4f6,#fff) border-box;
  border:1px solid transparent;
  border-radius:18px;
  overflow:hidden;
}
canvas{
  display:block;
  width:100%;
  height:100%;
}
.top-labels,.bottom-labels{
  position:absolute;
  left:0; right:0;
  display:flex;
  justify-content:space-around;
  pointer-events:none;
}
.top-labels{top:10px}
.bottom-labels{bottom:10px}
.label{
  width:84px;
  max-width:9vw;
  min-width:54px;
  padding:7px 5px;
  border-radius:10px;
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  font-size:12px;
  font-weight:900;
  text-align:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.bottom-labels .label{
  color:#6b7280;
}
.bottom-labels .label.coffee{
  background:#fff7ed;
  border-color:#fdba74;
  color:#9a3412;
}
.result{
  margin-top:16px;
  min-height:84px;
  display:grid;
  place-items:center;
  padding:16px;
  border-radius:16px;
  background:#f9fafb;
  border:1px dashed #d1d5db;
  text-align:center;
  font-size:18px;
  font-weight:900;
}
.result.win{
  border:1px solid #fdba74;
  background:linear-gradient(135deg,#fff7ed,#fff);
  color:#9a3412;
  animation:pop .45s ease;
}
@keyframes pop{
  0%{transform:scale(.96)}
  65%{transform:scale(1.03)}
  100%{transform:scale(1)}
}
.confetti{
  position:fixed;
  width:9px;
  height:14px;
  top:-20px;
  border-radius:3px;
  z-index:20;
  pointer-events:none;
  animation:fall 1.8s linear forwards;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(720deg);opacity:.9}
}
@media(max-width:760px){
  .hero{align-items:flex-start}
  .bean{font-size:40px}
  .setup{grid-template-columns:1fr}
  .names{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
  .wrap{width:min(100% - 16px,1120px);padding-top:20px}
  .panel{padding:15px}
  .hero h1{font-size:32px}
  .names{grid-template-columns:1fr}
  .actions{display:grid;grid-template-columns:1fr}
  button{width:100%}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div>
      <h1>☕ 커피쏘기 사다리타기</h1>
      <p>참석자 이름을 넣고 사다리를 타서 오늘의 커피 담당자를 재미있게 뽑아보세요.</p>
    </div>
    <div class="bean" aria-hidden="true">🫘</div>
  </section>

  <section class="panel setup">
    <div>
      <div class="control-title">참석 인원</div>
      <div class="count-row">
        <label for="count">인원</label>
        <select id="count" aria-label="참석 인원">
          <option>2</option><option>3</option><option>4</option><option selected>5</option>
          <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
        </select>
      </div>
      <div class="actions">
        <button id="shuffleBtn" class="secondary" type="button">사다리 다시 섞기</button>
        <button id="startBtn" class="primary" type="button">☕ 커피 쏠 사람 뽑기</button>
      </div>
      <div class="guide">사다리는 매번 무작위로 생성됩니다. 결과는 팀 분위기를 위한 재미 요소로 활용해 주세요.</div>
    </div>

    <div>
      <div class="control-title">참석자 이름</div>
      <div id="names" class="names"></div>
    </div>
  </section>

  <section class="panel game-panel">
    <div class="game-head">
      <h2>사다리</h2>
      <div id="status" class="status">준비 완료</div>
    </div>

    <div class="ladder-scroll">
      <div id="stage" class="ladder-stage">
        <canvas id="canvas"></canvas>
        <div id="topLabels" class="top-labels"></div>
        <div id="bottomLabels" class="bottom-labels"></div>
      </div>
    </div>

    <div id="result" class="result" aria-live="polite">
      버튼을 누르면 사다리를 따라 결과가 공개됩니다.
    </div>
  </section>
</main>

<script>
(() => {
  const countEl = document.getElementById('count');
  const namesEl = document.getElementById('names');
  const canvas = document.getElementById('canvas');
  const stage = document.getElementById('stage');
  const topLabels = document.getElementById('topLabels');
  const bottomLabels = document.getElementById('bottomLabels');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const startBtn = document.getElementById('startBtn');
  const resultEl = document.getElementById('result');
  const statusEl = document.getElementById('status');

  const defaults = ['영경','민지','준호','서연','현우','지수','도윤','유진','하린','정우'];
  let rungs = [];
  let coffeeSlot = 0;
  let animating = false;
  let raf = 0;

  function participantCount(){
    return Math.max(2, Math.min(10, Number(countEl.value) || 5));
  }

  function buildInputs(){
    const n = participantCount();
    const previous = [...namesEl.querySelectorAll('input')].map(i => i.value);
    namesEl.innerHTML = '';
    for(let i=0;i<n;i++){
      const input = document.createElement('input');
      input.className = 'name-input';
      input.type = 'text';
      input.maxLength = 12;
      input.placeholder = `참석자 ${i+1}`;
      input.value = previous[i] || defaults[i] || `참석자 ${i+1}`;
      input.setAttribute('aria-label', `참석자 ${i+1} 이름`);
      input.addEventListener('input', renderLabels);
      namesEl.appendChild(input);
    }
    generateLadder();
  }

  function names(){
    return [...namesEl.querySelectorAll('input')].map((input,i) => input.value.trim() || `참석자 ${i+1}`);
  }

  function generateLadder(){
    if(animating) return;
    const n = participantCount();
    rungs = [];
    const levels = Math.max(8, n * 2);
    let prevCol = -2;

    for(let level=0; level<levels; level++){
      const possible = [];
      for(let col=0; col<n-1; col++){
        if(col !== prevCol && col !== prevCol+1 && col !== prevCol-1) possible.push(col);
      }
      if(possible.length && Math.random() > 0.15){
        const col = possible[Math.floor(Math.random()*possible.length)];
        rungs.push({level, col});
        prevCol = col;
      } else {
        prevCol = -2;
      }
    }

    coffeeSlot = Math.floor(Math.random()*n);
    resultEl.className = 'result';
    resultEl.textContent = '버튼을 누르면 사다리를 따라 결과가 공개됩니다.';
    statusEl.textContent = '새 사다리 준비 완료';
    render();
  }

  function layout(){
    const rect = stage.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(rect.width*dpr));
    canvas.height = Math.max(1, Math.floor(rect.height*dpr));
    canvas.style.width = rect.width+'px';
    canvas.style.height = rect.height+'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,w:rect.width,h:rect.height};
  }

  function positions(w,h){
    const n = participantCount();
    const left = 58, right = w-58, top = 72, bottom = h-70;
    const xs = [];
    for(let i=0;i<n;i++) xs.push(left + (right-left)*(i/(n-1)));
    return {xs,top,bottom};
  }

  function rungY(level, top, bottom){
    const maxLevel = Math.max(8, participantCount()*2);
    return top + (bottom-top) * ((level+1)/(maxLevel+1));
  }

  function render(pathPoints=[]){
    const {ctx,w,h} = layout();
    const {xs,top,bottom} = positions(w,h);
    ctx.clearRect(0,0,w,h);

    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#d1d5db';
    xs.forEach(x=>{
      ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,bottom); ctx.stroke();
    });

    ctx.lineWidth = 4;
    ctx.strokeStyle = '#9ca3af';
    rungs.forEach(r=>{
      const y = rungY(r.level,top,bottom);
      ctx.beginPath(); ctx.moveTo(xs[r.col],y); ctx.lineTo(xs[r.col+1],y); ctx.stroke();
    });

    if(pathPoints.length>1){
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#8b5e3c';
      ctx.beginPath();
      ctx.moveTo(pathPoints[0].x,pathPoints[0].y);
      for(let i=1;i<pathPoints.length;i++) ctx.lineTo(pathPoints[i].x,pathPoints[i].y);
      ctx.stroke();

      const p = pathPoints[pathPoints.length-1];
      ctx.fillStyle = '#5f3c26';
      ctx.beginPath(); ctx.arc(p.x,p.y,7,0,Math.PI*2); ctx.fill();
    }

    renderLabels();
  }

  function renderLabels(){
    const list = names();
    topLabels.innerHTML = '';
    bottomLabels.innerHTML = '';
    list.forEach(name=>{
      const el = document.createElement('div');
      el.className='label';
      el.textContent=name;
      el.title=name;
      topLabels.appendChild(el);
    });
    list.forEach((_,i)=>{
      const el = document.createElement('div');
      el.className='label' + (i===coffeeSlot?' coffee':'');
      el.textContent = i===coffeeSlot ? '☕ 커피' : '통과';
      bottomLabels.appendChild(el);
    });
  }

  function trace(startIndex){
    const {w,h} = stage.getBoundingClientRect();
    const {xs,top,bottom} = positions(w,h);
    let col = startIndex;
    const points = [{x:xs[col],y:top}];
    const sorted = [...rungs].sort((a,b)=>a.level-b.level);

    sorted.forEach(r=>{
      const y = rungY(r.level,top,bottom);
      points.push({x:xs[col],y});
      if(r.col===col){
        col++;
        points.push({x:xs[col],y});
      } else if(r.col+1===col){
        col--;
        points.push({x:xs[col],y});
      }
    });
    points.push({x:xs[col],y:bottom});
    return {end:col,points};
  }

  function findCoffeeStarter(){
    for(let i=0;i<participantCount();i++){
      if(trace(i).end===coffeeSlot) return i;
    }
    return 0;
  }

  function animate(){
    if(animating) return;
    animating = true;
    startBtn.disabled = true;
    shuffleBtn.disabled = true;
    countEl.disabled = true;
    statusEl.textContent = '사다리 타는 중…';
    resultEl.className='result';
    resultEl.textContent='누가 커피를 쏘게 될까요? ☕';

    const starter = findCoffeeStarter();
    const {points,end} = trace(starter);
    const segments = [];
    let total=0;
    for(let i=1;i<points.length;i++){
      const a=points[i-1], b=points[i];
      const len=Math.hypot(b.x-a.x,b.y-a.y);
      segments.push({a,b,len,start:total});
      total+=len;
    }

    const duration = 2800;
    const startTime = performance.now();

    function frame(now){
      const t=Math.min(1,(now-startTime)/duration);
      const eased = 1-Math.pow(1-t,3);
      const dist=total*eased;
      const shown=[points[0]];

      for(const s of segments){
        if(dist>=s.start+s.len){
          shown.push(s.b);
        }else if(dist>s.start){
          const ratio=(dist-s.start)/s.len;
          shown.push({
            x:s.a.x+(s.b.x-s.a.x)*ratio,
            y:s.a.y+(s.b.y-s.a.y)*ratio
          });
          break;
        }else break;
      }
      render(shown);

      if(t<1){
        raf=requestAnimationFrame(frame);
      }else{
        finish(starter,end);
      }
    }
    raf=requestAnimationFrame(frame);
  }

  function finish(starter,end){
    animating=false;
    startBtn.disabled=false;
    shuffleBtn.disabled=false;
    countEl.disabled=false;
    const person=names()[starter];
    resultEl.className='result win';
    resultEl.innerHTML=`☕ <strong>${escapeHtml(person)}</strong> 님이 오늘 커피를 쏩니다! 🎉`;
    statusEl.textContent='결과 공개!';
    confetti();
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }

  function confetti(){
    const symbols=['#8b5e3c','#7c3aed','#16a34a','#f59e0b','#ef4444'];
    for(let i=0;i<34;i++){
      const el=document.createElement('span');
      el.className='confetti';
      el.style.left=(Math.random()*100)+'vw';
      el.style.background=symbols[Math.floor(Math.random()*symbols.length)];
      el.style.animationDelay=(Math.random()*.35)+'s';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),2300);
    }
  }

  countEl.addEventListener('change',buildInputs);
  shuffleBtn.addEventListener('click',generateLadder);
  startBtn.addEventListener('click',animate);
  window.addEventListener('resize',()=>{ if(!animating) render(); });

  buildInputs();
})();
</script>
</body>
</html>
